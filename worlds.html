<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Select — Null Island</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero" style="padding:2.5rem 1.5rem 1rem;">
  <h1 style="font-size:2rem;">Null Island</h1>
  <p>Pick a world. Locked worlds open once you've cleared the one before them.
  <strong>Par</strong> is the fewest moves anyone's found to clear a level —
  match it and you earn a <span class="star">&#9733;</span>. Clear every
  world for a <strong>win</strong> — then all six lock again for a fresh run.</p>
  <div id="rank-badge" class="rank-badge"></div>
</header>
<div class="wrap">
  <p style="text-align:center;"><a href="index.html">&larr; back to title</a></p>
  <div id="world-grid" class="world-grid"></div>

  <h2 style="text-align:center; margin-top:2.5rem; font-size:1.1rem; color:var(--dim); text-transform:uppercase; letter-spacing:0.06em;">Achievements</h2>
  <div id="achievement-grid" class="achievement-grid"></div>

  <div class="settings-row">
    <button class="button danger" id="reset-btn">Reset progress</button>
  </div>
</div>
<script src="js/worlds-registry.js"></script>
<script src="js/achievements.js"></script>
<script src="js/ranks.js"></script>
<script src="js/progress.js"></script>
<script>
function renderRank() {
  const el = document.getElementById('rank-badge');
  const rank = computeRank();
  const winWord = rank.wins === 1 ? 'win' : 'wins';
  el.innerHTML = `Rank: <strong>${rank.title}</strong> (${rank.wins} ${winWord})` +
    (rank.next ? ` — ${rank.next.winsAway} more to ${rank.next.title}` : ' — max rank');
}

function renderGrid() {
  const gridEl = document.getElementById('world-grid');
  gridEl.innerHTML = '';
  WORLDS.forEach((world) => {
    const unlocked = Progress.isUnlocked(world.id, WORLDS);
    const state = Progress.getWorld(world.id);
    const wrapper = document.createElement(unlocked && world.built ? 'a' : 'div');
    wrapper.className = 'panel world-card' + (unlocked ? '' : ' locked');
    if (unlocked && world.built) wrapper.href = world.path;

    const h2 = document.createElement('h2');
    h2.textContent = world.title;
    wrapper.appendChild(h2);

    const concept = document.createElement('div');
    concept.className = 'concept';
    concept.textContent = world.concept;
    wrapper.appendChild(concept);

    const status = document.createElement('div');
    status.className = 'status-line';
    if (!unlocked) {
      status.textContent = 'Locked — clear the previous world first.';
    } else if (!world.built) {
      status.textContent = 'Unlocked — coming soon.';
    } else if (!state.cleared) {
      status.textContent = 'Not cleared yet.';
    } else {
      status.textContent = 'Cleared — click to replay.';
    }
    wrapper.appendChild(status);

    if (unlocked && world.built && state.cleared) {
      const par = state.parMoves !== null && state.parMoves !== undefined ? state.parMoves : world.parMoves;
      const score = document.createElement('div');
      score.className = 'score-line';
      const starred = par !== null && state.bestMoves <= par;
      score.innerHTML = `Best: ${state.bestMoves} moves` +
        (par !== null ? ` (par ${par})` : '') +
        (starred ? ' <span class="star">&#9733;</span>' : '');
      wrapper.appendChild(score);
    }

    gridEl.appendChild(wrapper);
  });
}

function renderAchievements() {
  const earned = Progress.getAchievements();
  const gridEl = document.getElementById('achievement-grid');
  gridEl.innerHTML = '';
  ACHIEVEMENTS.forEach((a) => {
    const has = earned.includes(a.id);
    const card = document.createElement('div');
    card.className = 'panel achievement-badge' + (has ? ' earned' : ' locked');
    card.title = has ? a.description : '???  ' + a.description;
    card.innerHTML = `<div class="achievement-icon">${a.icon}</div>
      <div class="achievement-title">${has ? a.title : '???'}</div>`;
    gridEl.appendChild(card);
  });
}

document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Reset all progress and best scores? This can\'t be undone.')) {
    Progress.resetAll();
    renderGrid();
    renderAchievements();
    renderRank();
  }
});

checkEscapeeAchievement(WORLDS);
renderGrid();
renderAchievements();
renderRank();
</script>
</body>
</html>
