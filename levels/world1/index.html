<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Area 1 — The Wreck — Null Island</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.3/acorn.min.js"></script>
</head>
<body>
<header class="hero" style="padding:2rem 1.5rem 1rem;">
  <h1 style="font-size:1.8rem;">Area 1 — The Wreck</h1>
  <p>The ship is scrap. There's a gap in the hull plating ahead — you'll need to jump it. Write code to walk your character to the flag.</p>
</header>
<div class="wrap">
  <p style="text-align:center;"><a href="../../worlds.html">&larr; back to Area Select</a></p>
  <div class="world-layout">
    <div class="panel">
      <div id="level-canvas-holder"></div>
      <div class="controls">
        <button class="button" id="run-btn">Run</button>
        <button class="button secondary" id="step-btn">Step</button>
        <span id="status">Write your moves, then press Run.</span>
      </div>
      <div class="controls" id="step-controls" style="display:none;">
        <button class="button secondary" id="step-next-btn">Next &#9654;</button>
        <span id="step-status"></span>
      </div>
      <div id="world-meta" class="world-meta"></div>
      <div id="achievement-notice" class="world-meta"></div>
      <a id="next-world-btn" class="button secondary next-world-btn"></a>
    </div>
    <div class="panel editor-panel">
      <h2>Your code</h2>
      <textarea id="code">// Get to the flag. moveRight() walks one step.
// jump() leaps two steps forward, clearing a gap.
moveRight();
moveRight();
</textarea>
      <div class="hint" id="level-hint"></div>
      <div class="command-palette">
        <h3>Commands</h3>
        <div id="command-list" class="command-list"></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="../../js/engine.js"></script>
<script src="../../js/progress.js"></script>
<script src="../../js/worlds-registry.js"></script>
<script src="../../js/achievements.js"></script>
<script src="world1.js"></script>
</body>
</html>
